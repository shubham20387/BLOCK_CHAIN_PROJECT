<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMOP electronics | Web3 Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #00ff88;
            --bg-overlay: rgba(8, 8, 8, 0.85);
            --card: rgba(18, 18, 18, 0.95);
            --text: #ffffff;
            --muted: #a0a0a0;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            background-image: url('top-view-devices-supplies-composition.jpg');
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-overlay);
            z-index: -1;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
            z-index: 100;
        }

        .logo { font-size: 22px; font-weight: 700; letter-spacing: 2px; }

        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .container {
            width: 500px;
            background: var(--card);
            border: 1px solid #333;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
        }

        h1 { font-size: 32px; text-align: center; margin: 10px 0; }
        .subtitle { color: var(--muted); text-align: center; font-size: 14px; margin-bottom: 30px; }
        .hidden { display: none; }

        select.multi-select {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 16px;
            color: white;
            height: 150px;
            outline: none;
        }

        .invoice-box {
            background: #181818;
            padding: 25px;
            border-radius: 20px;
            border: 1px dashed #444;
            margin-bottom: 25px;
        }

        .row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
        .row.total { border-top: 1px solid #333; padding-top: 15px; font-size: 24px; color: var(--accent); font-weight: 600; }

        .btn {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { transform: translateY(-3px); }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.8);
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>

    <div id="bg-container"></div>
    <div class="overlay"></div>

    <nav class="navbar">
        <div class="logo">SMOP</div>
    </nav>

    <div class="main-wrapper">
        <div class="container">
            
            <div id="step0">
                <h1 style="font-size: 42px;">WELCOME<br>TO STORE</h1>
                <p class="subtitle">Premium Electronics • Blockchain Secured</p>
                <button class="btn" onclick="goToStep1()">Explore Collection</button>
            </div>

            <div id="step1" class="hidden">
                <h1>Catalog</h1>
                <p class="subtitle">Select items (Hold Ctrl to multi-select)</p>
                <select id="productSelect" class="multi-select" multiple>
                    <option value="2500">Wireless Earbuds — ₹2,500</option>
                    <option value="5000">Mechanical Keyboard — ₹5,000</option>
                    <option value="12000">Gaming Monitor — ₹12,000</option>
                    <option value="1500">Fast Charger 65W — ₹1,500</option>
                </select>
                <button class="btn" style="margin-top: 25px;" onclick="goToStep2()">Checkout</button>
            </div>

            <div id="step2" class="hidden">
                <h1>Final Invoice</h1>
                <div class="invoice-box">
                    <div class="row"><span>Items:</span> <span id="count">0</span></div>
                    <div class="row"><span>Subtotal:</span> <span id="subtotal">₹0</span></div>
                    <div class="row"><span>GST (18%):</span> <span id="tax">₹0</span></div>
                    <div class="row total">
                        <span>Total:</span>
                        <div style="text-align: right;">
                            <span id="totalINR">₹0</span><br>
                            <span id="totalETH" style="font-size: 12px; color: var(--muted);">0 ETH</span>
                        </div>
                    </div>
                </div>
                <button class="btn" onclick="goToStep3()">Pay with MetaMask</button>
            </div>

            <div id="step3" class="hidden" style="text-align: center;">
                <h1 style="color: var(--accent); font-size: 48px;">Successful</h1>
                <p class="subtitle" style="font-size: 18px;">Transaction initiated on Ethereum!</p>
                <button class="btn" onclick="location.reload()">New Order</button>
            </div>

        </div>
    </div>

    <div class="footer">
        Developed by: <b>Shubhamkumar, Mohit, Om, Parth</b>
    </div>

    <script>
        const ETH_RATE = 250000;
        const CONTRACT_ADDRESS = "0xd8b934580fcE35a11B58C6D73aDeE468a2833fa8";
        const bg = document.getElementById('bg-container');

        function goToStep1() {
            bg.style.backgroundImage = "url('modern-stationary-collection-arrangement.jpg')";
            document.getElementById('step0').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }

        function goToStep2() {
            const select = document.getElementById('productSelect');
            const items = Array.from(select.selectedOptions);
            if(items.length === 0) return alert("Select a product first!");

            let sum = 0;
            items.forEach(i => sum += parseInt(i.value));
            const tax = Math.round(sum * 0.18);
            const total = sum + tax;

            document.getElementById('count').innerText = items.length;
            document.getElementById('subtotal').innerText = "₹" + sum.toLocaleString();
            document.getElementById('tax').innerText = "₹" + tax.toLocaleString();
            document.getElementById('totalINR').innerText = "₹" + total.toLocaleString();
            document.getElementById('totalETH').innerText = (total/ETH_RATE).toFixed(5) + " ETH";

            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        async function goToStep3() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const ethStr = document.getElementById('totalETH').innerText.split(' ')[0];
                    const ethAmount = parseFloat(ethStr);

                    // SHOW SUCCESS SCREEN FIRST FOR DEMO PURPOSES
                    document.getElementById('step2').classList.add('hidden');
                    document.getElementById('step3').classList.remove('hidden');

                    // TRIGGER METAMASK
                    await window.ethereum.request({
                        method: 'eth_sendTransaction',
                        params: [{
                            from: accounts[0],
                            to: CONTRACT_ADDRESS,
                            value: '0x' + Math.floor(ethAmount * 1e18).toString(16),
                        }],
                    });
                } catch (error) {
                    console.log("Transaction window opened.");
                }
            } else {
                alert("Please install MetaMask!");
            }
        }
    </script>
</body>
</html>
